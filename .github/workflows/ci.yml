name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Fresh-checkout verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libegl1-mesa-dev libwayland-dev libxkbcommon-dev
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install matching WebAssembly bindings generator
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Verify
        run: sh tools/verify.sh
